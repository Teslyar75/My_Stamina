# Полный Ubuntu diagnostic suite для дерева PR34 (8d1dc5d).
# Только эта ветка. Не quality-gate, не Windows, продуктовый код не трогает.
name: ubuntu full diagnostic

on:
  push:
    branches:
      - cursor/ubuntu-narrow-diag-c61e
  workflow_dispatch:

concurrency:
  group: ubuntu-narrow-diag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ubuntu-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: "Системные пакеты (Linux: Tk и дисплей)"
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install pytest-timeout

      - name: Full Ubuntu tests under Xvfb
        run: |
          set -o pipefail
          xvfb-run -a python -X faulthandler -m pytest tests/ \
            -vv --tb=short -s -p no:cacheprovider \
            --timeout=90 --timeout-method=signal \
            --durations=30 \
            --junitxml=ubuntu_full_diag.xml \
            2>&1 | tee ubuntu_full_diag.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ubuntu-full-diagnostic-log
          path: |
            ubuntu_full_diag.log
            ubuntu_full_diag.xml
          if-no-files-found: ignore
