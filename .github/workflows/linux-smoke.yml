name: Linux smoke

# Проверка «а запускается ли десктопная версия на Linux»: настоящая Ubuntu,
# виртуальный экран, запуск как у пользователя (python3 main.py) и как из install.sh,
# плюс случаи, когда у людей «ничего не происходит»: нет tkinter, нет экрана, старый Python.
on:
  push:
    branches: [agent/opencode/linux-check]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  run-app:
    name: Запуск на ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Что за система
        run: |
          . /etc/os-release; echo "$PRETTY_NAME"
          python3 --version

      - name: Пакеты как в README
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb mpv espeak-ng alsa-utils imagemagick
          python3 -c 'import tkinter; print("tkinter", tkinter.TkVersion)'

      - name: Запуск python3 main.py под виртуальным экраном
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1600x1000x24 >/dev/null 2>&1 &
          sleep 2
          python3 main.py > /tmp/run.out 2>&1 &
          app=$!
          sleep 20
          if kill -0 $app 2>/dev/null; then
            echo "ИТОГ: процесс живёт через 20 с (pid $app) — окно запустилось"
          else
            wait $app; echo "ИТОГ: процесс завершился, код $?"
          fi
          import -window root /tmp/screen.png 2>/dev/null || true
          echo "--- вывод программы ---"
          tail -40 /tmp/run.out || true
          echo "--- журнал запуска ---"
          cat "$HOME/.local/share/StarTyping/start.log" 2>/dev/null | tail -40 || echo "журнала нет"
          echo "--- файлы ошибок ---"
          ls -la "$HOME/.local/share/StarTyping/" 2>/dev/null || true
          for f in "$HOME"/.local/share/StarTyping/*error*.log; do
            [ -f "$f" ] && { echo "== $f"; tail -60 "$f"; }
          done
          kill $app 2>/dev/null || true
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shot-${{ matrix.os }}
          path: |
            /tmp/screen.png
            /tmp/run.out

  installer:
    name: Установка через install.sh (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Пакеты
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk python3-venv xvfb
      - name: install.sh без sudo и без запуска
        run: bash install.sh --no-voice --no-launch --no-system
      - name: Запуск из .venv
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1600x1000x24 >/dev/null 2>&1 &
          sleep 2
          .venv/bin/python main.py > /tmp/venv.out 2>&1 &
          app=$!
          sleep 20
          if kill -0 $app 2>/dev/null; then
            echo "ИТОГ: .venv запустился и живёт через 20 с"
          else
            wait $app; echo "ИТОГ: .venv завершился, код $?"
          fi
          echo "--- вывод ---"
          tail -40 /tmp/venv.out || true
          echo "--- журнал ---"
          cat "$HOME/.local/share/StarTyping/start.log" 2>/dev/null | tail -40 || true
          kill $app 2>/dev/null || true
          exit 0

  no-tk:
    name: Без python3-tk (как после одного pip install)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Убираем tkinter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          sudo apt-get purge -y -qq python3-tk || true
          python3 -c 'import tkinter' 2>&1 | tail -3 || true
      - name: Запуск и что видит пользователь
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1600x1000x24 >/dev/null 2>&1 &
          sleep 2
          set +e
          timeout 20 python3 main.py > /tmp/notk.out 2>&1
          echo "ИТОГ: код выхода $?"
          echo "--- что напечатала программа ---"
          cat /tmp/notk.out
          echo "--- журнал запуска ---"
          cat "$HOME/.local/share/StarTyping/start.log" 2>/dev/null || echo "журнала нет"
          echo "--- другие логи ---"
          for f in "$HOME"/.local/share/StarTyping/*.log; do [ -f "$f" ] && { echo "== $f"; tail -30 "$f"; }; done
          exit 0

  no-display:
    name: Без экрана (SSH, Wayland без XWayland, sudo)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Пакеты
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
      - name: Запуск без DISPLAY
        run: |
          unset DISPLAY WAYLAND_DISPLAY
          set +e
          timeout 20 python3 main.py > /tmp/nodisp.out 2>&1
          echo "ИТОГ: код выхода $?"
          echo "--- что напечатала программа ---"
          cat /tmp/nodisp.out
          echo "--- журнал ---"
          cat "$HOME/.local/share/StarTyping/start.log" 2>/dev/null || echo "журнала нет"
          exit 0

  py39:
    name: Python 3.9 (Debian 11 / Ubuntu 20.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.9
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq software-properties-common xvfb
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3.9 python3.9-tk
          python3.9 --version
      - name: Запуск
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1600x1000x24 >/dev/null 2>&1 &
          sleep 2
          set +e
          timeout 20 python3.9 main.py > /tmp/py39.out 2>&1
          echo "ИТОГ: код выхода $?"
          echo "--- что напечатала программа ---"
          head -40 /tmp/py39.out
          echo "--- журнал ---"
          cat "$HOME/.local/share/StarTyping/start.log" 2>/dev/null || echo "журнала нет"
          exit 0
