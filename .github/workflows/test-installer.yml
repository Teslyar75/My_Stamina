name: test installer

on:
  pull_request:
    paths:
      - 'install.bat'
      - '.github/workflows/test-installer.yml'
  workflow_dispatch:

jobs:
  test-install-bat:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Создать fake Python для симуляции pip failure
        shell: cmd
        run: |
          mkdir fake_python_fail
          echo @echo off > fake_python_fail\python.exe.bat
          echo exit /b 1 >> fake_python_fail\python.exe.bat
          copy fake_python_fail\python.exe.bat fake_python_fail\python.bat

      - name: Создать fake Python для симуляции pip success
        shell: cmd
        run: |
          mkdir fake_python_ok
          echo @echo off > fake_python_ok\python.exe.bat
          echo if "%%1"=="-m" if "%%2"=="venv" exit /b 0 >> fake_python_ok\python.exe.bat
          echo if "%%1"=="-m" if "%%2"=="pip" exit /b 0 >> fake_python_ok\python.exe.bat
          echo if "%%1"=="-c" exit /b 0 >> fake_python_ok\python.exe.bat
          echo if "%%1"=="--version" echo Python 3.12.0 >> fake_python_ok\python.exe.bat
          echo exit /b 0 >> fake_python_ok\python.exe.bat
          copy fake_python_ok\python.exe.bat fake_python_ok\python.bat

      - name: Test install.bat с pip failure (должен останавливаться)
        shell: cmd
        continue-on-error: true
        id: test_fail
        run: |
          set STAMINA_PYTHON=%CD%\fake_python_fail\python.bat
          set STAMINA_NO_SHORTCUT=1
          set STAMINA_NO_LAUNCH=1
          call install.bat
          echo INSTALLER_EXIT=%ERRORLEVEL% >> %GITHUB_OUTPUT%

      - name: Проверка что installer остановился на pip failure
        shell: pwsh
        run: |
          $exitCode = "${{ steps.test_fail.outputs.INSTALLER_EXIT }}"
          if ($exitCode -ne "1") {
            Write-Error "install.bat должен вернуть exit code 1 при pip failure, получен: $exitCode"
            exit 1
          }
          Write-Host "✓ install.bat корректно остановился с exit code 1"

      - name: Test install.bat с pip success (должен завершиться успешно)
        shell: cmd
        id: test_success
        run: |
          set STAMINA_PYTHON=%CD%\fake_python_ok\python.bat
          set STAMINA_NO_SHORTCUT=1
          set STAMINA_NO_LAUNCH=1
          call install.bat
          echo INSTALLER_EXIT=%ERRORLEVEL% >> %GITHUB_OUTPUT%

      - name: Проверка что installer завершился успешно
        shell: pwsh
        run: |
          $exitCode = "${{ steps.test_success.outputs.INSTALLER_EXIT }}"
          if ($exitCode -ne "0") {
            Write-Error "install.bat должен вернуть exit code 0 при успехе, получен: $exitCode"
            exit 1
          }
          Write-Host "✓ install.bat корректно завершился с exit code 0"
