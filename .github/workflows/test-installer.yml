name: test installer

on:
  pull_request:
    paths:
      - 'install.bat'
      - '.github/workflows/test-installer.yml'
  workflow_dispatch:

jobs:
  test-install-bat:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Создать fake Python для симуляции pip failure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path fake_python_fail
          @'
          @echo off
          setlocal
          if "%~1"=="-m" if "%~2"=="venv" (endlocal & exit /b 0)
          if "%~1"=="-c" (endlocal & exit /b 0)
          if "%~1"=="--version" (
            echo Python 3.12.0
            endlocal
            exit /b 0
          )
          if "%~1"=="-m" if "%~2"=="pip" if "%~3"=="install" (
            echo PIP_INSTALL_MARKER
            endlocal
            exit /b 1
          )
          endlocal
          exit /b 0
          '@ | Out-File -FilePath fake_python_fail\python.bat -Encoding ASCII
          Write-Host "=== Содержимое fake_python_fail\python.bat ==="
          Get-Content fake_python_fail\python.bat
          Write-Host "=== Конец файла ==="

      - name: Создать fake Python для симуляции pip success
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path fake_python_ok
          @'
          @echo off
          setlocal
          if "%~1"=="-m" if "%~2"=="venv" (endlocal & exit /b 0)
          if "%~1"=="-c" (endlocal & exit /b 0)
          if "%~1"=="--version" (
            echo Python 3.12.0
            endlocal
            exit /b 0
          )
          if "%~1"=="-m" if "%~2"=="pip" if "%~3"=="install" (
            echo PIP_INSTALL_MARKER
            endlocal
            exit /b 0
          )
          endlocal
          exit /b 0
          '@ | Out-File -FilePath fake_python_ok\python.bat -Encoding ASCII

      - name: Test install.bat с pip failure (должен останавливаться)
        shell: cmd
        continue-on-error: true
        id: test_fail
        run: |
          if exist .venv rd /s /q .venv
          set STAMINA_PYTHON=%CD%\fake_python_fail\python.bat
          set STAMINA_NO_SHORTCUT=1
          set STAMINA_NO_LAUNCH=1
          set STAMINA_NO_PAUSE=1
          call install.bat > install_fail_output.txt 2>&1
          echo INSTALLER_EXIT=%ERRORLEVEL% >> %GITHUB_OUTPUT%

      - name: Проверка что pip failure block достигнут
        shell: pwsh
        run: |
          if (-not (Test-Path install_fail_output.txt)) {
            Write-Error "Файл install_fail_output.txt не найден"
            exit 1
          }
          $output = Get-Content install_fail_output.txt -Raw
          Write-Host "=== Содержимое install_fail_output.txt ==="
          Write-Host $output
          Write-Host "=== Конец файла ==="
          if ($output -notmatch "PIP_INSTALL_MARKER") {
            Write-Error "Маркер pip install не найден - fake python не был вызван для pip install"
            exit 1
          }
          Write-Host "✓ pip install block был достигнут (маркер найден)"

      - name: Проверка что installer остановился на pip failure
        shell: pwsh
        run: |
          $exitCode = "${{ steps.test_fail.outputs.INSTALLER_EXIT }}"
          if ($exitCode -ne "1") {
            Write-Error "install.bat должен вернуть exit code 1 при pip failure, получен: $exitCode"
            Get-Content install_fail_output.txt
            exit 1
          }
          Write-Host "✓ install.bat корректно остановился с exit code 1"

      - name: Test install.bat с pip success (должен завершиться успешно)
        shell: cmd
        id: test_success
        run: |
          if exist .venv rd /s /q .venv
          set STAMINA_PYTHON=%CD%\fake_python_ok\python.bat
          set STAMINA_NO_SHORTCUT=1
          set STAMINA_NO_LAUNCH=1
          set STAMINA_NO_PAUSE=1
          call install.bat > install_ok_output.txt 2>&1
          echo INSTALLER_EXIT=%ERRORLEVEL% >> %GITHUB_OUTPUT%

      - name: Проверка что pip success block достигнут
        shell: pwsh
        run: |
          if (-not (Test-Path install_ok_output.txt)) {
            Write-Error "Файл install_ok_output.txt не найден"
            exit 1
          }
          $output = Get-Content install_ok_output.txt -Raw
          Write-Host "=== Содержимое install_ok_output.txt ==="
          Write-Host $output
          Write-Host "=== Конец файла ==="
          if ($output -notmatch "PIP_INSTALL_MARKER") {
            Write-Error "Маркер pip install не найден - fake python не был вызван для pip install"
            exit 1
          }
          Write-Host "✓ pip install block был достигнут (маркер найден)"

      - name: Проверка что installer завершился успешно
        shell: pwsh
        run: |
          $exitCode = "${{ steps.test_success.outputs.INSTALLER_EXIT }}"
          if ($exitCode -ne "0") {
            Write-Error "install.bat должен вернуть exit code 0 при успехе, получен: $exitCode"
            Get-Content install_ok_output.txt
            exit 1
          }
          Write-Host "✓ install.bat корректно завершился с exit code 0"
