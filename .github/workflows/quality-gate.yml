# Конвейер качества: аудиты один раз + тесты по шардам на двух ОС.
#
# Что было до этого: linux-smoke.yml поднимает окно и проверяет, что процесс жив
# 20 секунд; release.yml собирает notes из CHANGELOG. Ни один тест и ни один аудит
# (contrast_audit, i18n_check, alt_ui_audit, dep_audit) в CI не запускался, и
# Windows — основная платформа продукта — не тестировался в CI вообще.
#
# Быстрые шаги (--only) блокируют всегда: они зелёные уже сегодня. Тесты идут
# отдельными шардами: полный прогон на одной машине упирался в таймаут job,
# поэтому четыре шарда на каждой ОС делят файлы детерминированно без pytest-xdist (Tk).

name: quality gate

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# Новый пуш отменяет предыдущий прогон этой же ветки — экономия минут.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Аудиты (один раз)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: "Системные пакеты (Linux: Tk и дисплей)"
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Быстрый гейт (contrast + i18n + dep)
        run: python tools/ci_gate.py --only contrast --only i18n --only dep

      - name: Отчёт гейта
        if: always()
        run: python tools/ci_gate.py --only contrast --only i18n --only dep --md gate_report.md --json gate_report.json

      - name: Паритет альт-интерфейса (advisory, не красит сборку)
        continue-on-error: true
        run: xvfb-run -a python tools/alt_ui_audit.py --md alt_ui_report.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-audits
          path: |
            gate_report.md
            gate_report.json
            alt_ui_report.md
          if-no-files-found: ignore

  tests:
    name: Тесты ${{ matrix.os }} · шард ${{ matrix.shard }}/4
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: "Системные пакеты (Linux: Tk и дисплей)"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Файлы шарда ${{ matrix.shard }}
        shell: bash
        run: python tools/pytest_shard.py --shards 4 --shard ${{ matrix.shard }} --summary > shard_files.txt

      - name: Тесты (Windows — нативный Tk)
        if: runner.os == 'Windows'
        shell: bash
        # без per-test timeout: на Win thread-method замедляет весь прогон (~10+ мин) и
        # не укладываемся в таймаут job; зависания LabScreen глушим stop()/Destroy
        # -vv перебивает -q из pyproject: имя теста видно сразу, а не только в сводке
        # bash, не pwsh: иначе код выхода pytest теряется в пайпе с Tee-Object
        run: |
          set -o pipefail
          mapfile -t files < <(tr -d '\r' < shard_files.txt)
          python -m pytest "${files[@]}" -vv -o console_output_style=classic -rfE --tb=short --durations=20 -p no:cacheprovider 2>&1 | tee pytest_shard.log

      - name: Тесты (Linux — под Xvfb, Tk рисует через X11)
        if: runner.os == 'Linux'
        shell: bash
        # thread: signal не прерывает зависание внутри Tk/C на Xvfb
        run: |
          set -o pipefail
          mapfile -t files < <(tr -d '\r' < shard_files.txt)
          xvfb-run -a python -m pytest "${files[@]}" -vv -o console_output_style=classic -rfE --tb=short --durations=20 -p no:cacheprovider --timeout=90 --timeout-method=thread 2>&1 | tee pytest_shard.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-tests-${{ matrix.os }}-shard-${{ matrix.shard }}
          path: |
            shard_files.txt
            pytest_shard.log
          if-no-files-found: ignore

  # Статический контроль отдельным job: дешёвый, даёт подсветку строк прямо в PR,
  # на первых порах не блокирует слияние.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - name: Ruff (базовый набор правил из pyproject.toml)
        run: ruff check stamina tools tests main.py
